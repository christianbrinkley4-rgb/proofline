<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Job Application for Tax Intern at Northwind Tax</title>
    <!-- Synthetic page for scripts/check-kit-fill.mjs. Its structure follows a live
         job-boards.greenhouse.io embed form read on September 30, 2026: plain text inputs
         labelled with label[for], react-select comboboxes (role=combobox) for Yes/No
         questions and places, file inputs for documents, and EEO comboboxes. -->
    <style>
      body { font: 15px system-ui; max-width: 720px; margin: 24px auto; padding: 0 16px; }
      .field-wrapper { margin: 14px 0; }
      label { display: block; font-weight: 600; margin-bottom: 4px; }
      input[type=text], input[type=tel], textarea { width: 100%; padding: 8px; }
    </style>
  </head>
  <body>
    <h1>Tax Intern</h1>
    <form method="get" action="/embed/job_app?for=northwind&amp;token=5550001" id="application-form" class="application--form">
      <div class="application--questions">
        <div class="field-wrapper"><label id="first_name-label" for="first_name">First Name<span aria-hidden="true">*</span></label><input id="first_name" type="text" aria-required="true" /></div>
        <div class="field-wrapper"><label id="last_name-label" for="last_name">Last Name<span aria-hidden="true">*</span></label><input id="last_name" type="text" aria-required="true" /></div>
        <div class="field-wrapper"><label id="email-label" for="email">Email<span aria-hidden="true">*</span></label><input id="email" type="text" aria-required="true" /></div>
        <div class="field-wrapper"><label id="country-label" for="country">Country</label><input id="country" type="text" role="combobox" aria-expanded="false" /></div>
        <div class="field-wrapper"><label id="phone-label" for="phone">Phone</label><input id="phone" type="tel" /></div>
        <div class="field-wrapper"><label id="candidate-location-label" for="candidate-location">Location (City)<span aria-hidden="true">*</span></label><input id="candidate-location" type="text" role="combobox" aria-required="true" aria-expanded="false" /><input type="text" tabindex="-1" aria-hidden="true" required style="opacity:0;height:0;position:absolute" /></div>
        <div class="field-wrapper"><div role="group" aria-labelledby="upload-label-resume" aria-required="true" class="file-upload"><div id="upload-label-resume" class="label upload-label">Resume/CV</div><button type="button" class="btn btn--pill">Attach</button><label class="visually-hidden" for="resume">Attach</label><input id="resume" type="file" /></div></div>
        <div class="field-wrapper"><div role="group" aria-labelledby="upload-label-cover_letter" aria-required="false" class="file-upload"><div id="upload-label-cover_letter" class="label upload-label">Cover Letter</div><button type="button" class="btn btn--pill">Attach</button><label class="visually-hidden" for="cover_letter">Attach</label><input id="cover_letter" type="file" /></div></div>
        <div class="field-wrapper"><label id="question_1-label" for="question_1">LinkedIn Profile</label><input id="question_1" type="text" /></div>
        <div class="field-wrapper"><label id="question_2-label" for="question_2">Website or GitHub</label><input id="question_2" type="text" /></div>
        <div class="field-wrapper"><label id="question_3-label" for="question_3">What are your preferred gender pronouns?</label><input id="question_3" type="text" /></div>
        <div class="field-wrapper"><label id="question_4-label" for="question_4">How did you hear about us?<span aria-hidden="true">*</span></label><input id="question_4" type="text" role="combobox" aria-required="true" aria-expanded="false" /></div>
        <div class="field-wrapper"><div class="select__container"><label id="question_5-label" for="question_5" class="label select__label">Are you legally authorized to work in the United States? <span aria-hidden="true">*</span></label><div class="select__control"><div class="select__placeholder">Select...</div><input id="question_5" type="text" role="combobox" aria-required="true" aria-expanded="false" aria-labelledby="question_5-label" /></div></div></div>
        <div class="field-wrapper"><div class="select__container"><label id="question_6-label" for="question_6" class="label select__label">Will you now or in the future require sponsorship for employment visa status? <span aria-hidden="true">*</span></label><div class="select__control"><div class="select__placeholder">Select...</div><input id="question_6" type="text" role="combobox" aria-required="true" aria-expanded="false" aria-labelledby="question_6-label" /></div></div></div>
        <div class="field-wrapper"><label id="question_7-label" for="question_7">What experience do you have with Excel?</label><textarea id="question_7" rows="4"></textarea></div>
        <div class="field-wrapper"><label id="question_8-label" for="question_8">If you're not authorized to work at the stated location, what sponsorship would you require?</label><input id="question_8" type="text" /></div>
        <div class="field-wrapper"><label id="question_9-label" for="question_9">Do you consent to Northwind processing your personal information?<span aria-hidden="true">*</span></label><input id="question_9" type="text" role="combobox" aria-required="true" aria-expanded="false" /></div>
        <div class="field-wrapper"><label id="question_10-label" for="question_10">Earliest start date</label><input id="question_10" type="text" /></div>
        <div class="field-wrapper"><label id="gender-label" for="gender">Gender</label><input id="gender" type="text" role="combobox" aria-expanded="false" /></div>
        <div class="field-wrapper"><label id="veteran_status-label" for="veteran_status">Veteran Status</label><input id="veteran_status" type="text" role="combobox" aria-expanded="false" /></div>
      </div>
      <button type="submit">Submit application</button>
    </form>
    <script>
      window.__submitted = false;
      document.getElementById("application-form").addEventListener("submit", (e) => { window.__submitted = true; e.preventDefault(); });
    </script>
  </body>
</html>
